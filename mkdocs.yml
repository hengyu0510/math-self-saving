site_name: 数院自救指南
site_url: https://mathselfsaving.cn/
site_author: hengyu0510
site_description: >-
  数院自救指南

repo_name: math-self-saving
repo_url: https://github.com/hengyu0510/math-self-saving/

copyright: built on 2026.9.15

theme:
  name: material
  language: zh
  static_templates:
    - 404.html
  favicon: images/favicon.ico
  apple-touch-icon-precomposed: images/mobile_icon.png
  logo: images/logo-mark.svg
  include_search_page: false
  search_index_only: true

  features:
    - header.autohide
    - navigation.tracking
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - content.code.annotate

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: light blue
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: cyan
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to light mode

  font:
    text: Roboto Slab
    code: Roboto Mono
  icon:
    repo: fontawesome/brands/github

  custom_dir: overrides

markdown_extensions:
  - attr_list
  - md_in_html
  - footnotes

plugins:
  - i18n:
      languages:
        - locale: zh
          default: true
          name: 简体中文
          build: true
        - locale: en
          name: English
          build: true
          site_name: math-self-saving
          nav_translations:
            首页: Home
            数学基础: Foundations
            数学分析: Mathematical Analysis
            高等代数: Advanced Algebra
            线性代数: Linear Algebra
            解析几何: Analytic Geometry
            初等数论: Elementary Number Theory
            离散数学: Discrete Mathematics
            分析与方程: Analysis and Equations
            常微分方程: Ordinary Differential Equations
            偏微分方程: Partial Differential Equations
            复变函数: Complex Analysis
            实变函数: Real Analysis
            泛函分析: Functional Analysis
            调和分析: Harmonic Analysis
            代数与几何: Algebra and Geometry
            抽象代数: Abstract Algebra
            高等几何: Advanced Geometry
            微分几何: Differential Geometry
            拓扑学: Topology
            交换代数: Commutative Algebra
            代数数论: Algebraic Number Theory
            概率与统计: Probability and Statistics
            概率论: Probability Theory
            数理统计: Mathematical Statistics
            随机过程: Stochastic Processes
            多元统计分析: Multivariate Statistical Analysis
            时间序列分析: Time Series Analysis
            计算与应用: Computation and Applications
            数值分析: Numerical Analysis
            计算方法: Computational Methods
            最优化: Optimization
            运筹学: Operations Research
            控制论: Control Theory
            数学建模: Mathematical Modeling
            金融数学: Financial Mathematics
            交叉与进阶: Interdisciplinary and Advanced Topics
            数理逻辑: Mathematical Logic
            集合论: Set Theory
            组合数学: Combinatorics
            图论: Graph Theory
            信息论: Information Theory
            编码理论: Coding Theory
            密码学: Cryptography
            数学物理: Mathematical Physics
            工具与写作: Tools and Writing
            数学工具: Mathematical Tools
            数学写作: Mathematical Writing
            数学史: History of Mathematics
  - search:
      lang:
        - zh
        - en
  - git-revision-date:
  - minify:
      minify_html: true
  - open-in-new-tab:

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/hengyu0510/math-self-saving/
